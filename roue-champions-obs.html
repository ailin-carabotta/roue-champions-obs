  <style>
    :root {
      --gold: #f7c95c;
      --gold-light: #ffe7a7;
      --cream: #fff8e7;
      --ink: #080b16;
      --steel: #99b6e2;
      --card-width: clamp(145px, 17vw, 218px);
      --card-height: clamp(205px, 24vw, 310px);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      width: 100%;
      background: transparent !important;
    }

    body {
      color: var(--cream);
      font-family: "Fira Sans", sans-serif;
      overflow-x: hidden;
    }

    .app-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .heading-font { font-family: "Eczar", serif; }

    .eyebrow {
      color: var(--gold-light);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      text-shadow: 0 1px 12px rgba(247, 201, 92, .34);
    }

    .page-title {
      text-shadow: 0 2px 18px rgba(8, 11, 22, .92), 0 0 28px rgba(247, 201, 92, .18);
    }

    .carousel-section {
      width: 100%;
      max-width: 1320px;
      position: relative;
      margin: 0 auto;
      padding: 1.25rem 0 1.4rem;
    }

    .carousel-glow {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(44vw, 440px);
      height: 74%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(247,201,92,.16), rgba(88,130,194,.07) 45%, transparent 72%);
      filter: blur(12px);
      pointer-events: none;
    }

    .carousel-viewport {
      width: min(100%, calc(var(--card-width) * 2.0));
      margin: 0 auto;
      position: relative;
      overflow: hidden;
      padding: 1rem 0 1.1rem;
      mask-image: linear-gradient(to right, transparent, black 9%, black 91%, transparent);
      -webkit-mask-image: linear-gradient(to right, transparent, black 9%, black 91%, transparent);
    }

    .carousel-track {
      display: flex;
      align-items: center;
      gap: clamp(.65rem, 1.4vw, 1.15rem);
      width: max-content;
      padding: .65rem calc(50% - var(--card-width) / 2);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .champion-card {
      width: var(--card-width);
      height: var(--card-height);
      flex: 0 0 var(--card-width);
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(164, 194, 239, .72);
      border-radius: 12px;
      background: linear-gradient(145deg, #16213c, #090e1c);
      box-shadow: 0 12px 24px rgba(0, 0, 0, .55), inset 0 0 0 1px rgba(255,255,255,.06);
      transform: scale(.92);
      opacity: .68;
      transition: transform .28s ease, opacity .28s ease, border-color .28s ease, box-shadow .28s ease;
    }

    .champion-card::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent 44%, rgba(4, 7, 15, .24) 61%, rgba(4, 7, 15, .96) 100%);
    }

    .champion-card.is-near {
      opacity: .92;
      transform: scale(.965);
    }

    .champion-card.is-winner {
      z-index: 2;
      opacity: 1;
      border-color: var(--gold-light);
      transform: scale(1.06);
      box-shadow: 0 0 0 2px rgba(247, 201, 92, .45), 0 0 26px rgba(247, 201, 92, .72), 0 22px 34px rgba(0,0,0,.72);
    }

    .champion-card.is-winner .card-name {
      color: var(--gold-light);
    }

    .champion-splash {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center center;
      position: absolute;
      inset: 0;
    }

    .champion-card.has-fallback .champion-splash { display: none; }

    .fallback-art {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #dceaff;
      text-align: center;
      font-family: "Eczar", serif;
      font-size: 1.35rem;
      line-height: 1.05;
      background:
        radial-gradient(circle at 30% 23%, rgba(247,201,92,.48), transparent 19%),
        linear-gradient(135deg, #263d6d 0%, #111b35 44%, #080b16 100%);
    }

    .champion-card.has-fallback .fallback-art { display: flex; }

    .card-name {
      position: absolute;
      z-index: 1;
      inset: auto .75rem .72rem;
      margin: 0;
      color: var(--cream);
      font-family: "Eczar", serif;
      font-size: clamp(.95rem, 1.55vw, 1.18rem);
      font-weight: 700;
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 2px 4px #000, 0 0 12px rgba(0,0,0,.8);
    }

    .selection-marker {
      position: absolute;
      z-index: 5;
      top: .3rem;
      bottom: .3rem;
      left: 50%;
      width: calc(var(--card-width) + 14px);
      transform: translateX(-50%);
      border: 2px solid rgba(255, 231, 167, .88);
      border-radius: 15px;
      box-shadow: 0 0 0 1px rgba(8,11,22,.92), 0 0 22px rgba(247,201,92,.56), inset 0 0 22px rgba(247,201,92,.12);
      pointer-events: none;
    }

    .selection-marker::before,
    .selection-marker::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.8));
    }

    .selection-marker::before {
      top: -11px;
      border-top: 15px solid var(--gold-light);
    }

    .selection-marker::after {
      bottom: -11px;
      border-bottom: 15px solid var(--gold-light);
    }

    .status-area {
      min-height: 98px;
      display: grid;
      place-items: center;
      padding: .75rem 1rem;
      text-align: center;
    }

    .status-panel { display: none; }
    .status-panel.is-active { display: block; animation: rise .28s ease both; }

    .loading-line {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,.24);
      border-top-color: var(--gold-light);
      border-radius: 999px;
      animation: spin .72s linear infinite;
    }

    .result-name {
      margin: .15rem 0 0;
      color: var(--gold-light);
      font-family: "Eczar", serif;
      font-size: clamp(1.65rem, 4vw, 2.65rem);
      font-weight: 800;
      line-height: 1.1;
      text-shadow: 0 0 20px rgba(247,201,92,.55);
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 640px) {
      :root {
        --card-width: clamp(132px, 45vw, 175px);
        --card-height: clamp(188px, 64vw, 250px);
      }

      .carousel-section { padding-top: .45rem; }
      .selection-marker { width: calc(var(--card-width) + 10px); }
      .carousel-viewport {
        mask-image: linear-gradient(to right, transparent, black 4%, black 96%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 4%, black 96%, transparent);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .champion-card { transition-duration: .01ms; }
    }
  </style>

      "Renata Glasc": "Renata",
      "Séraphine": "Seraphine",
      "Tahm Kench": "TahmKench",
      "Twisted Fate": "TwistedFate",
      "Vel'Koz": "Velkoz",
      "Xin Zhao": "XinZhao",
      "Zoé": "Zoe"
    };

    const track = document.getElementById("carousel-track");
    const viewport = document.getElementById("carousel-viewport");
    const resultName = document.getElementById("result-name");
    const announcement = document.getElementById("accessible-announcement");
    const resultPanel = document.getElementById("result-panel");

    let spinning = false;
    let currentOffset = 0;

    function championAssetName(name) {
      if (dataDragonNames[name]) return dataDragonNames[name];
      return name
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9]/g, "");
    }

    function splashUrl(name) {
      return "https://ddragon.leagueoflegends.com/cdn/img/champion/splash/" + championAssetName(name) + "_0.jpg";
    }

    function secureRandomIndex(max) {
      if (window.crypto && window.crypto.getRandomValues) {
        const limit = Math.floor(0x100000000 / max) * max;
        const values = new Uint32Array(1);
        do {
          window.crypto.getRandomValues(values);
        } while (values[0] >= limit);
        return values[0] % max;
      }
      return Math.floor(Math.random() * max);
    }

    function secureRandomUnit() {
      if (window.crypto && window.crypto.getRandomValues) {
        const value = new Uint32Array(1);
        window.crypto.getRandomValues(value);
        return value[0] / 0x100000000;
      }
      return Math.random();
    }

    function createCard(name, sequenceIndex) {
      const card = document.createElement("article");
      card.className = "champion-card";
      card.dataset.champion = name;
      card.dataset.sequenceIndex = String(sequenceIndex);

      const image = document.createElement("img");
      image.className = "champion-splash";
      image.style.objectPosition = focalPoints[name] || "50% 27%";
      image.src = splashUrl(name);
      image.alt = "";
      image.loading = "eager";
      image.addEventListener("error", () => card.classList.add("has-fallback"), { once: true });

      const fallback = document.createElement("div");
      fallback.className = "fallback-art";
      fallback.setAttribute("aria-hidden", "true");
      fallback.textContent = name;

      const label = document.createElement("p");
      label.className = "card-name";
      label.textContent = name;

      card.append(image, fallback, label);
      return card;
    }

    function buildSequence(winner, winnerPosition, pool = champions) {
      track.replaceChildren();
      const sequence = [];

      for (let i = 0; i < winnerPosition; i++) {
        sequence.push(pool[secureRandomIndex(pool.length)]);
      }
      sequence.push(winner);

      for (let i = 0; i < 18; i++) {
        sequence.push(pool[secureRandomIndex(pool.length)]);
      }

      sequence.forEach((name, index) => track.appendChild(createCard(name, index)));
      return winnerPosition;
    }

    function cardStep() {
      const firstCard = track.querySelector(".champion-card");
      if (!firstCard) return 0;
      const style = getComputedStyle(track);
      return firstCard.getBoundingClientRect().width + parseFloat(style.gap || 0);
    }

    function updateCardFocus() {
      const cards = [...track.querySelectorAll(".champion-card")];
      const viewportBox = viewport.getBoundingClientRect();
      const center = viewportBox.left + viewportBox.width / 2;

      cards.forEach(card => {
        const rect = card.getBoundingClientRect();
        const cardCenter = rect.left + rect.width / 2;
        const distance = Math.abs(cardCenter - center);
        card.classList.toggle("is-near", distance < rect.width * 1.1);
      });
    }

    function setTrackOffset(offset, duration, easing) {
      track.style.transition = duration ? "transform " + duration + "ms " + easing : "none";
      track.style.transform = "translate3d(" + offset + "px,0,0)";
      currentOffset = offset;
    }

    function cardMostCoveredByMarker() {
      const marker = viewport.querySelector(".selection-marker").getBoundingClientRect();
      return [...track.querySelectorAll(".champion-card")].reduce((best, card) => {
        const rect = card.getBoundingClientRect();
        const overlap = Math.max(0, Math.min(rect.right, marker.right) - Math.max(rect.left, marker.left));
        return !best || overlap > best.overlap ? { card, overlap } : best;
      }, null)?.card;
    }

    function drawChampion(input = {}) {
      if (spinning) return;
      const options = input instanceof Event ? (input.detail || {}) : input;
      const requestedPool = Array.isArray(options.pool) ? options.pool : champions;
      const pool = [...new Set(requestedPool)].filter(name => champions.includes(name));
      if (!pool.length) {
        window.dispatchEvent(new CustomEvent("champion-carousel:error", { detail: { message: "Aucun champion ne correspond aux filtres." } }));
        return;
      }
      spinning = true;
      announcement.textContent = "";
      resultPanel.classList.remove("is-active");

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const anchorPosition = reducedMotion ? 8 : 48 + secureRandomIndex(11);
      const anchorChampion = pool[secureRandomIndex(pool.length)];
      buildSequence(anchorChampion, anchorPosition, pool);

      requestAnimationFrame(() => {
        setTrackOffset(0, 0, "linear");
        const anchorCard = track.querySelector('[data-sequence-index="' + anchorPosition + '"]');
        const viewportBox = viewport.getBoundingClientRect();
        const cardBox = anchorCard.getBoundingClientRect();
        const viewportCenter = viewportBox.left + viewportBox.width / 2;
        const cardCenterAtZero = cardBox.left + cardBox.width / 2;
        const step = cardStep();
        // L'arrêt provisoire peut dépasser le milieu d'une carte dans les deux sens.
        // La carte occupant la majorité du curseur gagne ensuite le recentrage final.
        const fractionalLanding = reducedMotion ? 0 : (secureRandomUnit() * 1.7 - .85) * step;
        const targetOffset = viewportCenter - cardCenterAtZero + fractionalLanding;
        updateCardFocus();

        requestAnimationFrame(() => {
          const focusTimer = window.setInterval(updateCardFocus, 55);
          const finish = () => {
            window.clearInterval(focusTimer);
            const selected = cardMostCoveredByMarker();
            const center = viewport.getBoundingClientRect().left + viewport.getBoundingClientRect().width / 2;
            const selectedBox = selected.getBoundingClientRect();
            const correction = center - (selectedBox.left + selectedBox.width / 2);
            const settleDuration = reducedMotion ? 0 : 260 + Math.round(secureRandomUnit() * 190);
            const suspensePause = reducedMotion ? 0 : 140 + Math.round(secureRandomUnit() * 260);

            window.setTimeout(() => {
              setTrackOffset(currentOffset + correction, settleDuration, "cubic-bezier(.22,.9,.28,1.08)");
              window.setTimeout(() => {
                track.querySelectorAll(".champion-card").forEach(card => card.classList.remove("is-winner", "is-near"));
                selected.classList.add("is-winner");
                resultName.textContent = selected.dataset.champion;
                announcement.textContent = "Champion tiré : " + selected.dataset.champion;
                resultPanel.classList.add("is-active");
                spinning = false;

                window.dispatchEvent(new CustomEvent("champion-carousel:result", {
                  detail: { champion: selected.dataset.champion, constraintLabel: options.constraintLabel || "", filters: options.filters || {} }
                }));
              }, settleDuration + 30);
            }, suspensePause);
          };

          if (reducedMotion) {
            setTrackOffset(targetOffset, 0, "linear");
            finish();
            return;
          }

          const duration = 13500 + Math.round(secureRandomUnit() * 4500);
          const easings = ["cubic-bezier(.14,.76,.12,1)","cubic-bezier(.16,.74,.1,1)","cubic-bezier(.12,.78,.14,1)"];
          setTrackOffset(targetOffset, duration, easings[secureRandomIndex(easings.length)]);
          window.setTimeout(finish, duration + 40);
        });
      });
    }

    // API publique destinée au futur panneau de contrôle.
    // Depuis un script chargé dans cette page : window.championCarousel.spin()
    // Depuis la page elle-même : dispatchEvent(new Event("champion-carousel:spin"))
    window.championCarousel = Object.freeze({
      spin: drawChampion,
      isSpinning: () => spinning
    });
    window.addEventListener("champion-carousel:spin", drawChampion);
    window.addEventListener("message", event => {
      if (event.data?.type === "champion-carousel:spin") {
        drawChampion(event.data);
      }
    });
    if ("BroadcastChannel" in window) {
      const controlChannel = new BroadcastChannel("champion-wheel-control");
      controlChannel.addEventListener("message", event => {
        if (event.data?.type === "champion-carousel:spin") drawChampion(event.data);
      });
      window.addEventListener("champion-carousel:result", event => {
        controlChannel.postMessage({ type: "champion-carousel:result", ...event.detail });
      });
    }
    window.addEventListener("resize", () => {
      if (!spinning) {
        setTrackOffset(0, 0, "linear");
        updateCardFocus();
      }
    });

    buildSequence(champions[0], 4);
    updateCardFocus();
    lucide.createIcons();
  </script>
  <script src="firebase-config.js"></script>
  <script type="module" src="firebase-wheel.js"></script>
 
</body></html>
