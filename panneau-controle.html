<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panneau de contrôle — Roue des champions</title>
  <style>
    :root{color-scheme:dark;--bg:#080b16;--panel:#121827;--line:#2c3953;--gold:#f7c95c;--cream:#fff8e7;--muted:#9caccc;--green:#48d597;--danger:#ff7d7d}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1d2c4a,var(--bg) 42%);color:var(--cream);font:15px Inter,system-ui,sans-serif;min-height:100vh}
    .shell{width:min(1040px,calc(100% - 28px));margin:auto;padding:26px 0 44px}h1{margin:0;color:var(--gold);font-size:clamp(24px,4vw,38px)}.intro{margin:7px 0 22px;color:var(--muted)}
    .quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-bottom:18px}.quick button,.launch{border:1px solid #ffe5a0;background:#9c5d0d;color:white;border-radius:11px;padding:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 0 #573007}.quick button:hover,.launch:hover{filter:brightness(1.12);transform:translateY(-1px)}
    .card{background:rgba(18,24,39,.96);border:1px solid var(--line);border-radius:14px;padding:18px;margin:12px 0}.card h2{font-size:16px;margin:0 0 13px;color:var(--gold)}
    .choices{display:flex;flex-wrap:wrap;gap:8px}.chip{position:relative}.chip input{position:absolute;opacity:0;pointer-events:none}.chip span{display:block;padding:8px 11px;border:1px solid #44516c;border-radius:999px;color:#d9e2f5;cursor:pointer;user-select:none}.chip input:checked+span{color:#07110c;background:var(--green);border-color:#79f0bb;font-weight:800}
    .season-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}select,.small-button{background:#182239;color:white;border:1px solid #44516c;border-radius:8px;padding:8px 10px}.small-button{cursor:pointer}
    .connection{display:flex;gap:10px;align-items:center;justify-content:space-between}.connection p{margin:0;color:var(--muted)}.connection strong{color:var(--cream)}
    .footer{position:sticky;bottom:0;margin-top:18px;padding:14px;background:rgba(8,11,22,.94);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px;display:flex;gap:14px;align-items:center;justify-content:space-between}.count strong{color:var(--gold);font-size:22px}.count small{display:block;color:var(--muted)}.launch{min-width:220px}.launch:disabled{opacity:.4;cursor:not-allowed;transform:none}.status{min-height:22px;margin-top:11px;color:var(--green);font-weight:700}.status.error{color:var(--danger)}
    @media(max-width:650px){.footer{align-items:stretch;flex-direction:column}.launch{width:100%}.shell{width:min(100% - 18px,1040px)}}
  </style>
</head>
<body><main class="shell"><h1>Panneau de contrôle</h1><p class="intro">Sélectionne un tirage rapide ou combine librement les filtres.</p>
  <section class="card connection"><p><strong id="connectionTitle">Connexion requise</strong><br><span id="connectionDetail">Connecte-toi pour piloter la roue à distance.</span></p><button id="authButton" class="small-button">Se connecter avec Google</button></section>
  <section class="quick" id="quick"><button data-quick="all">🎲 100% aléatoire</button><button data-quick="adc">🏹 ADC</button><button data-quick="jungle">🌿 Jungle</button><button data-quick="support">🛡️ Support</button><button data-quick="classic">⏳ League Classic</button><button data-quick="ad">⚔️ Dégâts AD</button><button data-quick="ap">✨ Dégâts AP</button></section>
  <section class="card"><h2>Rôle principal</h2><div class="choices" id="roles"></div></section>
  <section class="card"><h2>Type de dégâts imposé</h2><div class="choices" id="damages"></div></section>
  <section class="card"><h2>Mode</h2><div class="choices"><label class="chip"><input id="classic" type="checkbox"><span>League Classic uniquement</span></label></div></section>
  <section class="card"><h2>Régions du lore</h2><div class="choices" id="regions"></div></section>
  <section class="card"><h2>Saisons de sortie</h2><div class="season-tools"><select id="until"></select><button class="small-button" id="selectUntil">Sélectionner jusqu’à</button><button class="small-button" id="clearSeasons">Effacer</button></div><div class="choices" id="seasons"></div></section>
  <div id="status" class="status"></div><footer class="footer"><div class="count"><strong id="count">173</strong> champions<small id="summary">Tous les champions</small></div><button id="launch" class="launch">Lancer le tirage filtré</button></footer>
</main><script src="champion-data.js"></script><script>
const data=window.CHAMPION_DATA, channel="BroadcastChannel" in window?new BroadcastChannel("champion-wheel-control"):null;let wheelWindow=null;
const labels={top:"Top",jungle:"Jungle",mid:"Mid",adc:"ADC",support:"Support"};
function radioGroup(node,items,name,allLabel){node.innerHTML=`<label class="chip"><input type="radio" name="${name}" value="" checked><span>${allLabel}</span></label>`+items.map(([v,l])=>`<label class="chip"><input type="radio" name="${name}" value="${v}"><span>${l}</span></label>`).join("")}
function checks(node,items,name){node.innerHTML=items.map(v=>`<label class="chip"><input type="checkbox" name="${name}" value="${v}"><span>${v}</span></label>`).join("")}
radioGroup(document.getElementById("roles"),data.roles.map(r=>[r,labels[r]]),"role","Tous");radioGroup(document.getElementById("damages"),[["AD","AD"],["AP","AP"]],"damage","Libre");checks(document.getElementById("regions"),data.regions,"region");checks(document.getElementById("seasons"),data.seasons,"season");
document.getElementById("until").innerHTML=data.seasons.map(s=>`<option>${s}</option>`).join("");
function selected(name){return [...document.querySelectorAll(`[name="${name}"]:checked`)].map(x=>x.value).filter(Boolean)}
function filters(){return{role:document.querySelector('[name="role"]:checked').value||null,damage:document.querySelector('[name="damage"]:checked').value||null,classic:document.getElementById("classic").checked,regions:selected("region"),seasons:selected("season")}}
function describe(f){const parts=[];if(f.role)parts.push(labels[f.role]);if(f.damage)parts.push(`Build ${f.damage} imposé`);if(f.classic)parts.push("League Classic");if(f.regions.length)parts.push(f.regions.join(" ou "));if(f.seasons.length)parts.push(f.seasons.join(" / "));return parts.join(" · ")||"Tous les champions"}
function refresh(){const f=filters(),pool=data.filter(f);document.getElementById("count").textContent=pool.length;document.getElementById("summary").textContent=describe(f);document.getElementById("launch").disabled=!pool.length;return{f,pool}}
function setRadio(name,value){const el=document.querySelector(`[name="${name}"][value="${value}"]`);if(el)el.checked=true}
function clearAll(){setRadio("role","");setRadio("damage","");document.getElementById("classic").checked=false;document.querySelectorAll('[name="region"],[name="season"]').forEach(x=>x.checked=false)}
function launch(overrides=null){if(overrides){clearAll();if(overrides.role)setRadio("role",overrides.role);if(overrides.damage)setRadio("damage",overrides.damage);if(overrides.classic)document.getElementById("classic").checked=true}const{f,pool}=refresh();if(!pool.length)return;const message={type:"champion-carousel:spin",pool:pool.map(c=>c.name),filters:f,constraintLabel:describe(f)};if(window.firebaseRemoteControl?.send)window.firebaseRemoteControl.send(message).catch(showError);else{channel?.postMessage(message);wheelWindow?.postMessage(message,"*")}document.getElementById("status").className="status";document.getElementById("status").textContent=`Tirage lancé parmi ${pool.length} champions…`}
function showError(error){document.getElementById("status").className="status error";document.getElementById("status").textContent=error?.message||"Impossible de transmettre le tirage."}
document.body.addEventListener("change",refresh);document.getElementById("launch").onclick=()=>launch();document.getElementById("selectUntil").onclick=()=>{const limit=data.seasons.indexOf(document.getElementById("until").value);document.querySelectorAll('[name="season"]').forEach((x,i)=>x.checked=i<=limit);refresh()};document.getElementById("clearSeasons").onclick=()=>{document.querySelectorAll('[name="season"]').forEach(x=>x.checked=false);refresh()};
document.getElementById("quick").onclick=e=>{const q=e.target.closest("button")?.dataset.quick;if(!q)return;if(q==="all")launch({});else if(q==="classic")launch({classic:true});else if(q==="ad"||q==="ap")launch({damage:q.toUpperCase()});else launch({role:q})};
channel?.addEventListener("message",e=>{if(e.data?.type==="champion-carousel:result"){document.getElementById("status").textContent=`Résultat : ${e.data.champion}${e.data.constraintLabel?" — "+e.data.constraintLabel:""}`}});refresh();
</script><script src="firebase-config.js"></script><script type="module" src="firebase-panel.js"></script></body></html>
